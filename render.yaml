services:
  - type: web
    name: sih-doctor-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8001
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: DB_PATH
        value: /app/data/hospital.db

  - type: web
    name: sih-doctor-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sih-doctor-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

