version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospitalos-doctor-backend
    restart: unless-stopped
    environment:
      - PORT=8001
      - NODE_ENV=production
      - DB_PATH=/app/data/hospital.db
      - USE_MOCK=false
      # Public demonstration server: demo data on, switchable by an administrator. Never with real patients.
      - ALLOW_DEMO_DATA=true
      - DEMO_TOGGLE=true
      - CORS_ORIGIN=*
    volumes:
      - medikiosk-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hospitalos-medikiosk-net
    labels:
      - "coolify.managed=true"
      - "coolify.type=service"
      - "coolify.name=hospitalos-doctor-backend"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospitalos-doctor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hospitalos-medikiosk-net
    labels:
      - "coolify.managed=true"
      - "coolify.type=application"
      - "coolify.name=hospitalos-doctor-frontend"
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # WebSocket Proxying support for Live Doctor Ambient Scribing
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"

volumes:
  medikiosk-data:
    name: hospitalos-doctor-medikiosk-data
    driver: local

networks:
  hospitalos-medikiosk-net:
    name: hospitalos-doctor-net
    driver: bridge
